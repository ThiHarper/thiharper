<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Thi Harper Calligraphy</title>
<meta name="description" content="Inquire about escort card calligraphy for your wedding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/logo-mark.png">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html"><img src="images/logo-black.png" alt="Thi Harper Calligraphy"></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    <nav class="site-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="services.html">Services &amp; Pricing</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <p class="eyebrow">Contact</p>
      <h1>Let's talk about your event</h1>
      <p class="lede">Share a few details below and I'll follow up with next steps and a quote.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <form class="contact-form" id="contactForm" action="https://formspree.io/f/xyeydabn" method="POST">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-row">
          <label for="event_date">Event date</label>
          <input type="date" id="event_date" name="event_date">
        </div>
        <div class="form-row">
          <label for="service">Service interested in</label>
          <select id="service" name="service">
            <option value="Escort Cards">Escort Cards</option>
            <option value="Not sure yet">Not sure yet / something else</option>
          </select>
        </div>
        <div class="form-row">
          <label for="guest_count">Approximate number of guests / cards</label>
          <input type="number" id="guest_count" name="guest_count" min="1">
        </div>
        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="btn" type="submit">Send Inquiry</button>
        <p class="form-note">I typically reply within 1&ndash;2 business days.</p>
        <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <img src="images/logo-white.png" alt="Thi Harper Calligraphy">
    <p>&copy; <span id="year"></span> Thi Harper Calligraphy &middot; <a href="contact.html">Get in touch</a></p>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/contact-form.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
